# Contributions Card - English (reference language)
#
# Format: one "key = value" per line. Lines starting with # are comments.
# {name} is replaced with a value, for example {count} or {entity}.
#
# Keys ending in .one / .two / .few / .many / .other / .zero are plural forms.
# The card picks the form with the browser's plural rules for the language
# (Intl.PluralRules) and falls back to .other. English needs .one and .other;
# other languages add the forms they use (Polish: .one, .few, .many).
# See https://www.unicode.org/cldr/charts/latest/supplemental/language_plural_rules.html

# Next to each month: days with activity in that month
days.one = {count} day
days.other = {count} days

# Card header: days with activity in the current month
this_month.one = {count} day this month
this_month.other = {count} days this month

# Tooltip of an active day: how many times something was counted that day
times.one = {count} time
times.other = {count} times

# Tooltip of a day without activity
no_activity = no activity

# Legend under the grid
legend.active = active
legend.none = none
legend.today = today

# Shown while statistics are loading
loading = Loading…

# Errors shown inside the card
error.entity_missing = Entity not found: {entity}
error.no_statistics = {entity} has no long-term statistics. Use a sensor with state_class "total" or "total_increasing".
error.fetch = Could not load statistics: {message}

# Visual card editor
editor.entity = Counter sensor
editor.title = Title (optional)
editor.months = Months to show
editor.layout = Layout
editor.layout_horizontal = Side by side
editor.layout_vertical = One under another
editor.last_activity_entity = Last activity timestamp sensor (optional)
editor.color = Active day color (optional)
